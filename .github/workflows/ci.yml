name: frontend and historical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-harness.lock -e .
      - run: npm run check
  console-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-harness.lock -e .
      - run: npm run build:console
      - run: python3 scripts/check_console_start.py --output .union/frontend-startup.json
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          UNION_PYTHON: python3
      - run: npm run test:novel
        env:
          UNION_PYTHON: python3
      - run: npm run test:model-service-browser
        env:
          UNION_PYTHON: python3
      - run: node scripts/u081-work-read-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u084-work-execution-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u084-work-execution-browser.cjs
        env:
          UNION_PYTHON: python3
          UNION_U084_PENDING_RECEIPT: '1'
          UNION_U084_READ_ONLY_RECEIPT: '1'
          UNION_U084_EVIDENCE: .union/u084-pending-receipt
      - run: node scripts/u097-model-events-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u097-model-events-browser.cjs
        env:
          UNION_PYTHON: python3
          UNION_U097_CONNECTION_REVOKE: '1'
          UNION_U097_EVIDENCE: .union/u097-connection-access-browser
      - run: node scripts/u105-work-registration-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u105-confirmed-access-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u106-result-delivery-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u086-cancel-recovery-browser.cjs
        env:
          UNION_PYTHON: python3
          UNION_U086_EVIDENCE: .union/u086-cancel-recovery
      - run: node scripts/u086-cancel-recovery-browser.cjs
        env:
          UNION_PYTHON: python3
          UNION_U086_LOSE_CANCEL: '1'
          UNION_U086_EVIDENCE: .union/u086-cancel-recovery-lost
      - run: node --test scripts/u108-work-events-browser.test.cjs
      - run: node scripts/u108-work-events-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node evidence/U-086/page-cancel-action/browser.cjs
        env:
          UNION_PYTHON: python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-browser-evidence
          path: |
            .union/frontend-browser-evidence
            .union/novel-browser-evidence
            .union/u081-work-read-browser
            .union/u084-page-execution
            .union/u084-pending-receipt
            .union/u097-model-events-browser
            .union/u097-connection-access-browser
            .union/u105-browser
            .union/u105-confirmed-access
            .union/u106-browser
            .union/u086-cancel-recovery
            .union/u086-cancel-recovery-lost
            .union/u108-work-events-browser
