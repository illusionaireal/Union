name: frontend and historical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-harness.lock -e .
      - run: npm run check
  console-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-harness.lock -e .
      - run: npm run build:console
      - run: python3 scripts/check_console_start.py --output .union/frontend-startup.json
      - run: npx playwright-core install --with-deps chromium
      # Current browser coverage and retained contract mapping: evidence/U-125/browser-migration.md
      - run: npm run test:browser
        env:
          UNION_PYTHON: python3
      - run: npm run test:creation
        env:
          UNION_PYTHON: python3
      - run: node scripts/u097-model-events-browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node scripts/u097-model-events-browser.cjs
        env:
          UNION_PYTHON: python3
          UNION_U097_CONNECTION_REVOKE: '1'
          UNION_U097_EVIDENCE: .union/u097-connection-access-browser
      - run: node --test scripts/u108-work-events-browser.test.cjs
      - run: node evidence/U-086/observed-settlement/browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node evidence/U-086/budget-conservation/browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node evidence/U-086/result-provenance/browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node evidence/U-086/reopened-download/browser.cjs
        env:
          UNION_PYTHON: python3
      - run: node evidence/U-086/material-read/browser.cjs
        env:
          UNION_PYTHON: python3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-browser-evidence
          path: |
            .union/u125-organization-entry
            .union/core-creation-browser
            .union/u097-model-events-browser
            .union/u097-connection-access-browser
