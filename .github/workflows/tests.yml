name: mechanism-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Includes SDK installation, the growing full suite and the fresh CLI loop.
    # Windows reached the former 15-minute job cap; this is not a product timeout.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Agent Harness
        run: python -m pip install -r requirements-harness.lock -e .
      - name: Mechanisms and fresh fixture CLI loop
        run: python scripts/validate.py --root .union/ci-fixture --output .union/ci-evidence
